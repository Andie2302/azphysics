[package]
name = "azphysics"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Physikalische Modelle und Simulationen auf mathematischen Werkzeugen aus azmath (Projektgerüst)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Andie2302/azphysics"
readme = "README.md"
publish = false

[features]
default = ["std"]
std = ["azmath/std"]
alloc = ["azmath/alloc"]
libm = ["azmath/libm"]
micromath = ["azmath/micromath"]

[dependencies]
azmath = { git = "https://github.com/Andie2302/azmath", rev = "c839bc7f2d83c6f4a2a9baef20abda2ea03fc2a9", default-features = false }
