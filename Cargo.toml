[package]
name = "azphysics"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Experimentelle Punktmassenmodelle und Simulationen auf mathematischen Werkzeugen aus azmath"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Andie2302/azphysics"
readme = "README.md"
publish = false

[features]
default = ["std"]
std = ["azmath/std"]
alloc = ["azmath/alloc"]
libm = ["azmath/libm"]
micromath = ["azmath/micromath"]

[dependencies]
azmath = { git = "https://github.com/Andie2302/azmath", rev = "3c6068a5f218aaba940a85a73606c9f61c8ebdc9", default-features = false }
