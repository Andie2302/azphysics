name: CI
on: [push, pull_request]
env:
  RUSTFLAGS: -D warnings
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: std, flags: "", runtime: true }
          - { name: std+alloc, flags: "--features alloc", runtime: true }
          - { name: libm, flags: "--no-default-features --features libm", runtime: true }
          - { name: libm+alloc, flags: "--no-default-features --features libm,alloc", runtime: true }
          - { name: micromath, flags: "--no-default-features --features micromath", runtime: true }
          - { name: micromath+alloc, flags: "--no-default-features --features micromath,alloc", runtime: true }
          - { name: all, flags: "--all-features", runtime: true }
          - { name: no-backend, flags: "--no-default-features", runtime: false }
          - { name: alloc-only, flags: "--no-default-features --features alloc", runtime: false }
    name: Test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked ${{ matrix.flags }}
        if: ${{ matrix.runtime }}
      - run: cargo test --locked --no-run ${{ matrix.flags }}
        if: ${{ !matrix.runtime }}
  embedded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [libm, "libm,alloc"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --no-default-features --features ${{ matrix.features }} --target thumbv7em-none-eabihf
  msrv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flags: ["", "--no-default-features --features libm,alloc"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo build --locked ${{ matrix.flags }}
